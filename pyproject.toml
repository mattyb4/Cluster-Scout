[project]
name = "cluster-scout"
version = "0.1.4"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.84",
    "biotite>=1.6.0",
    "customtkinter>=5.2.2",
    "kneed>=0.8.6",
    "matplotlib>=3.9.0",
    "numpy>=2.4.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "psutil>=7.2.2",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
    "Markdown>=3.4",
    "tkinterweb>=4.25.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# A deliberately conservative starting set for first-time adoption on an
# existing codebase -- pyflakes + pycodestyle + import sorting. Ruff enables
# nearly every rule family (bandit, pylint, bugbear, pyupgrade, etc.) when no
# select is given at all, which is too much noise (e.g. flags every
# deliberate `except Exception` around network calls) to turn on at once.
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
files = ["app.py", "main.py", "scripts", "ui", "tests"]
ignore_missing_imports = true
